name: EiXPropScore™ CI

on:
  push:
    branches:
      - main
      - feature/international-buyer-intelligence
      - feature/secure-extraction-engine
      - feature/intelligence-os-foundation
      - feature/intelligence-provider-layer-v2
      - release/eixpropscore-r149-verified
  pull_request:
    branches:
      - main
      - feature/international-buyer-intelligence
      - feature/secure-extraction-engine
      - feature/intelligence-os-foundation
      - feature/intelligence-provider-layer-v2

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
